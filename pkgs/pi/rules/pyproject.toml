[project]
name = "pi-rules"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2,<3", "psutil"]

[project.scripts]
pi-rules-check = "pi_rules.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_rules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
