[project]
name = "mcp-gateway"
version = "0.1.0"
description = "OAuth gateway for internal MCP servers"
authors = [{ name = "Ja-sonYun", email = "killa30867@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "cryptography>=50.0.2",
  "fastmcp==4.1.3",
  "py-key-value-aio[disk]>=0.4.6",
  "python-dotenv>=1.2.4",
]

[project.scripts]
mcp-gateway = "mcp_gateway.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
