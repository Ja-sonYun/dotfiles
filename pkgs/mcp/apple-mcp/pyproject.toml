[project]
name = "apple-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.30,<2",
  "httpx>=0.28,<1",
  "starlette>=0.27,<1",
  "uvicorn>=0.31,<1",
]

[project.scripts]
apple-mcp = "apple_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
