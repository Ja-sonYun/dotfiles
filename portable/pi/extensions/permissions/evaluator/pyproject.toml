[project]
name = "pi-permissions-evaluator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3"]

[project.scripts]
pi-permissions-evaluator = "pi_rules.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_rules"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
