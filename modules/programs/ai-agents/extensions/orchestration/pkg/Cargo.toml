[package]
name = "agent-hub"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
crossterm = "0.28"
fs2 = "0.4"
libc = "0.2"
portable-pty = "0.9.0"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tui-term = "=0.2.0"
vt100 = "0.15.2"
uuid = { version = "1", features = ["v4"] }
